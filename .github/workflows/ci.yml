name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2p
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI service container; not a secret.
      DATABASE_URL: postgres://postgres:postgres@localhost:54329/e2p
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
      - run: pnpm install --frozen-lockfile
      - name: Throwaway test keys (generated per run, never stored)
        run: |
          echo "PII_ENC_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "PHONE_HASH_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Lint (site + agent typecheck)
        run: pnpm lint
      - name: Tests (kernel build, agent, cargo)
        run: pnpm test
      - name: Offline eval (fixtures only; fails on any drift from the committed baseline or RESULTS.md)
        run: pnpm run eval -- --check
      - name: Adversarial suite (hostile inputs replayed offline; fails on any quote, wrong outcome or untyped kernel input)
        run: pnpm adversarial
      - name: Ledger verify (sim writes real chained rows, then the chain is walked)
        run: |
          pnpm sim run fixtures/banquet-01.json
          pnpm sim run fixtures/wedding-300-out-of-season.json
          pnpm sim two-tenants fixtures/two-tenants.json
          pnpm sim run fixtures/card-template-banquet-01.json
          pnpm sim run fixtures/card-unapproved-banquet-01.json
          pnpm card compile rate-cards/templates/fictional-banquet-template
          pnpm ledger verify
